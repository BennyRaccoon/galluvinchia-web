    display: flex; align-items: center; justify-content: center;
  }
  button.icon-btn:active { background: #ececE6; }
  #card {
    background: white; border: 1px solid #d3d1c7; border-radius: 12px;
    padding: 40px 24px; text-align: center; cursor: pointer; user-select: none;
    min-height: 180px; display: flex; flex-direction: column; justify-content: center;
    gap: 10px; margin-bottom: 16px;
  }
  #sv { font-size: 30px; font-weight: 500; }
  #en { font-size: 16px; color: #5f5e5a; display: none; }
  #expl { font-size: 13px; color: #7a7972; display: none; line-height: 1.4; padding: 0 8px; }
  #hint { font-size: 12px; color: #888780; margin-top: 8px; }
  .actions { display: flex; gap: 8px; margin-bottom: 16px; }
  .actions button {
    flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #d3d1c7;
    background: white; font-size: 15px; cursor: pointer;
  }
  #reviewBtn { color: #A32D2D; }
  #knowBtn { color: #3B6D11; }
  .footer { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #5f5e5a; }
  .footer button {
    font-size: 12px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid #d3d1c7; background: white; cursor: pointer;
  }
  .note { font-size: 12px; color: #888780; text-align: center; margin-top: 24px; line-height: 1.5; }
</style>

const catSel = document.getElementById('catSel');
const svEl = document.getElementById('sv');
const enEl = document.getElementById('en');
const explEl = document.getElementById('expl');
const hintEl = document.getElementById('hint');
const cardEl = document.getElementById('card');
const progressEl = document.getElementById('progress');

let allCards = [];
let known = new Set();
let deck = [];
let idx = 0;
let flipped = false;

Object.keys(DATA).forEach(cat => {
  const opt = document.createElement('option');
  opt.value = cat; opt.textContent = cat;
  catSel.appendChild(opt);
  DATA[cat].forEach(([sv,en,expl]) => allCards.push({sv,en,expl,cat}));
});
const allOpt = document.createElement('option');
allOpt.value = 'Todas'; allOpt.textContent = 'Todas las categorías (' + allCards.length + ')';
catSel.insertBefore(allOpt, catSel.firstChild);
catSel.value = 'Todas';

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDeck(){
  const cat = catSel.value;
  deck = (cat === 'Todas' ? allCards : allCards.filter(c => c.cat === cat)).filter(c => !known.has(c.sv));
  if (deck.length === 0) deck = (cat === 'Todas' ? allCards : allCards.filter(c => c.cat === cat));
  shuffle(deck);
  idx = 0;
  showCard();
}

function showCard(){
  if (deck.length === 0) { svEl.textContent = 'Sin palabras'; enEl.style.display='none'; explEl.style.display='none'; progressEl.textContent=''; return; }
  const c = deck[idx % deck.length];
  svEl.textContent = c.sv;
  enEl.textContent = c.en;
  explEl.textContent = c.expl;
  enEl.style.display = 'none';
  explEl.style.display = 'none';
  flipped = false;
  hintEl.style.display = 'block';
  hintEl.textContent = 'Toca la ficha para ver la traducción';
  const cat = catSel.value;
  const total = cat === 'Todas' ? allCards.length : allCards.filter(x=>x.cat===cat).length;
  const knownCount = cat === 'Todas' ? known.size : allCards.filter(x=>x.cat===cat && known.has(x.sv)).length;
  progressEl.textContent = knownCount + ' / ' + total + ' dominadas';
}

function speak(){
  const c = deck[idx % deck.length];
  if (!c) return;
  if (typeof window.speechSynthesis === 'undefined' || typeof SpeechSynthesisUtterance === 'undefined') {
    hintEl.textContent = 'La pronunciación no está disponible en este visor. Abre el archivo directamente en Safari/Chrome para escucharla.';
    hintEl.style.display = 'block';
    return;
  }
  const u = new SpeechSynthesisUtterance(c.sv);
  u.lang = 'sv-SE';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

cardEl.addEventListener('click', () => {
  flipped = !flipped;
  enEl.style.display = flipped ? 'block' : 'none';
  explEl.style.display = flipped ? 'block' : 'none';
  hintEl.style.display = flipped ? 'none' : 'block';
  if (flipped) speak();
});

document.getElementById('speakBtn').addEventListener('click', speak);
document.getElementById('knowBtn').addEventListener('click', () => {
  const c = deck[idx % deck.length];
  if (c) known.add(c.sv);
  buildDeck();
});
document.getElementById('reviewBtn').addEventListener('click', () => {
  idx++;
  showCard();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  known.clear();
  buildDeck();
});
catSel.addEventListener('change', buildDeck);

buildDeck();
</script>
